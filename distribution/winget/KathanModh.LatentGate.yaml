ShortDescription: Local-first vision-language pipeline — compress images, text, and documents via Ollama
Description: >
  LatentGate is a VL-JEPA-inspired pipeline that compresses images, text,
  conversations, and RAG documents locally via Ollama, then sends only
  compact semantic payloads to any LLM API — cutting token costs by ~80%.
