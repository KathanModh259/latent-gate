[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-gate"
dynamic = ["version"]
description = "Local-first vision-language pipeline inspired by VL-JEPA. Compress images, text, conversations, and RAG documents locally via Ollama before sending to any LLM API. Deterministic, fact-preserving token optimizer plus MCP server, FastAPI server and video processing."
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "Kathan Modh"}
]
keywords = [
    "vlm",
    "vision-language",
    "ollama",
    "token-optimization",
    "vl-jepa",
    "local-llm",
    "cost-reduction",
    "selective-decoding",
    "mcp",
    "model-context-protocol",
    "claude-code",
    "cursor",
    "cline",
    "prompt-compression",
    "rag",
    "ai-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.5",
]
mcp = [
    "mcp>=1.0,<2",  # mcp 2.x removed the low-level Server decorators we use
]
video = [
    "opencv-python>=4.9.0",
]
embeddings = [
    "torch>=2.0.0",
    "sentence-transformers>=2.7.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
]
metrics = [
    "prometheus-client>=0.19.0",
]
multilang = [
    "langdetect>=1.0.9",
]
config = [
    "pyyaml>=6.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli_w>=1.0.0",
]
langchain = [
    "langchain-core>=0.2.0",
]
bedrock = [
    "boto3>=1.34.0",
]
# Exact token counts (otherwise a calibrated estimate, ~6% mean error)
tokens = [
    "tiktoken>=0.7.0",
]
all = [
    "mcp>=1.0,<2",  # mcp 2.x removed the low-level Server decorators we use
    "opencv-python>=4.9.0",
    "torch>=2.0.0",
    "sentence-transformers>=2.7.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "prometheus-client>=0.19.0",
    "langdetect>=1.0.9",
    "pyyaml>=6.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli_w>=1.0.0",
    "langchain-core>=0.2.0",
    "boto3>=1.34.0",
    "tiktoken>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/KathanModh259/latent-gate"
Repository = "https://github.com/KathanModh259/latent-gate"
Issues = "https://github.com/KathanModh259/latent-gate/issues"
Changelog = "https://github.com/KathanModh259/latent-gate/blob/master/CHANGELOG.md"

[project.scripts]
latent-gate = "latent_gate.cli:main"
latent-gate-api = "latent_gate.api_server:main"
latent-gate-mcp = "latent_gate.mcp_server:cli_main"

[tool.setuptools.dynamic]
version = {attr = "latent_gate.__version__"}

[tool.setuptools.packages.find]
include = ["latent_gate*"]
exclude = ["tests*", "examples*", "integrations*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Explicit rule set: ruff 0.16 widened its defaults, which broke CI overnight
# without any code change. Widen deliberately, not via tool upgrades.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
