# ============================================================================
# Grafana Datasource Provisioning — auto-configured on container start
# ============================================================================
# This file is mounted into the Grafana container at:
#   /etc/grafana/provisioning/datasources/datasources.yml
# ============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "10s"
      queryTimeout: "30s"
      httpMethod: "POST"
    version: 1
