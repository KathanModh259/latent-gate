name: Publish to MCP Registry

# Runs after the Publish workflow succeeds (the registry verifies the PyPI package
# and its `mcp-name:` marker exist), or manually.
on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-registry:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login proves ownership of io.github.KathanModh259/*
      contents: read
    env:
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v4

      - name: Check server.json matches the package version
        run: |
          PKG=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('latent_gate/__init__.py').read()).group(1))")
          SRV=$(python -c "import json;d=json.load(open('server.json'));print(d['version'], d['packages'][0]['version'])")
          echo "package $PKG | server.json $SRV"
          [ "$SRV" = "$PKG $PKG" ] || { echo "::error::server.json version must equal $PKG"; exit 1; }

      - name: Install mcp-publisher (pinned, checksum-verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

      - name: Verify listing
        run: |
          sleep 5
          curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.KathanModh259/latent-gate" \
            | python -c "import sys,json; s=[i.get('server',i) for i in json.load(sys.stdin)['servers']]; print([(x['name'], x['version']) for x in s]); assert s"
